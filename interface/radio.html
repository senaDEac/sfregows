<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sfregows Radio</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: monospace;
      }

      #radio-app {
        width: 100vw; height: 100vh;
        background: #1a1a2e;
        position: relative;
        overflow: hidden;
      }

      #radio-titlebar {
        position: absolute; top: 0; left: 0;
        width: 275px; height: 14px;
        cursor: default;
      }

      #radio-close {
        position: absolute; top: 3px; right: 6px;
        width: 9px; height: 9px;
        cursor: pointer;
        background: url('images/main/TITLEBAR.png') no-repeat -18px 0;
      }
      #radio-close:hover { filter: brightness(1.3); }
      #radio-close:active { background-position: -18px -9px; }

      #radio-title-text {
        position: absolute; top: 3px; left: 20px;
        color: #00ff00; font-size: 8px;
        text-shadow: 0 0 2px #00ff00;
        white-space: nowrap;
      }

      #radio-station-list {
        position: absolute;
        top: 18px; left: 3px;
        width: 270px;
        height: calc(100vh - 22px);
        display: flex; flex-wrap: wrap;
        padding: 4px; gap: 3px;
        overflow-y: auto;
        align-content: flex-start;
      }

      #radio-station-list::-webkit-scrollbar { width: 6px; }
      #radio-station-list::-webkit-scrollbar-track { background: #1a1a2e; }
      #radio-station-list::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 3px; }

      .station {
        width: 32px; height: 32px;
        border: 1px solid #5c5c63;
        border-radius: 6px;
        cursor: pointer;
        overflow: hidden;
        object-fit: contain;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .station:hover { border-color: #00ff00; }
      .station.active {
        border-color: #00ff00;
        box-shadow: 0 0 6px #00ff00;
      }

      #now-playing {
        position: absolute;
        bottom: 2px; left: 3px;
        width: 270px; height: 12px;
        overflow: hidden;
        display: flex; align-items: center;
      }
      #now-playing span {
        display: inline-block; white-space: nowrap;
        color: #00ff00; font-size: 8px;
        letter-spacing: 0.5px;
        text-shadow: 0 0 2px #00ff00;
        animation: scroll 10s linear infinite;
        padding-left: 100%;
      }
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

      .resize-handle {
        position: absolute; bottom: 0; right: 0;
        width: 14px; height: 14px;
        cursor: nwse-resize;
        z-index: 200;
      }
      .resize-handle::before {
        content: ''; position: absolute;
        bottom: 1px; right: 1px;
        width: 0; height: 0;
        border-style: solid;
        border-width: 0 0 10px 10px;
        border-color: transparent transparent rgba(150,150,150,0.6) transparent;
      }
      .resize-handle:hover::before {
        border-color: transparent transparent rgba(0,255,0,0.8) transparent;
      }
    </style>
  </head>
  <body>
    <div id="radio-app">
      <div id="radio-titlebar">
        <span id="radio-title-text">RADIO</span>
        <div id="radio-close" title="Close"></div>
      </div>
      <div id="radio-station-list"></div>
      <div id="now-playing"><span>No station</span></div>
      <div class="resize-handle" id="radio-resize"></div>
    </div>
    <script src="./js/radio-window.js"></script>
  </body>
</html>
