<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sfregows Video</title>
    <link rel="stylesheet" href="../css/video.css" />
  </head>
  <body>
    <div id="video-app">
      <!-- TITLEBAR -->
      <div id="video-titlebar">
        <span id="video-title-text">VIDEO</span>
        <div id="video-close" title="Close"></div>
      </div>

      <!-- VIDEO DISPLAY -->
      <div id="video-display">
        <video id="video-player" preload="metadata"></video>
        <div id="video-overlay">
          <span id="video-no-media">No media loaded</span>
        </div>
      </div>

      <!-- CONTROLS -->
      <div id="video-controls">
        <div id="video-transport">
          <div id="video-prev" class="video-btn" title="Previous"></div>
          <div id="video-play" class="video-btn" title="Play"></div>
          <div id="video-pause" class="video-btn" title="Pause"></div>
          <div id="video-stop" class="video-btn" title="Stop"></div>
          <div id="video-next" class="video-btn" title="Next"></div>
        </div>

        <!-- SEEK BAR -->
        <div id="video-seek">
          <input type="range" id="video-seek-bar" min="0" max="1000" value="0" />
        </div>

        <!-- TIME -->
        <div id="video-time">
          <span id="video-time-current">0:00</span> / <span id="video-time-total">0:00</span>
        </div>

        <!-- VOLUME -->
        <div id="video-vol">
          <input type="range" id="video-volume" min="0" max="100" value="75" />
        </div>

        <!-- FULLSCREEN -->
        <div id="video-fullscreen" class="video-btn" title="Fullscreen"></div>
      </div>

      <!-- URL INPUT DIALOG -->
      <div id="video-url-dialog" class="hidden">
        <div class="video-dialog-title">Open URL</div>
        <input type="text" id="video-url-input" placeholder="http://..." />
        <div class="video-dialog-buttons">
          <button id="video-url-ok">OK</button>
          <button id="video-url-cancel">Cancel</button>
        </div>
      </div>

      <!-- RESIZE HANDLE -->
      <div id="video-resize" class="video-resize-handle"></div>
    </div>

    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="video-file-input" accept="video/*" style="display:none" />

    <script src="../js/video.js"></script>
  </body>
</html>
